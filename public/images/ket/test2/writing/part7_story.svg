<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Bicycle race story</title><desc id="desc">Three panels show a bicycle race from start to finish.</desc><rect width="1200" height="360" fill="#fff"/>
  <g stroke="#18372f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="10" width="380" height="340" rx="18" fill="#f1faf6"/><rect x="410" y="10" width="380" height="340" rx="18" fill="#fff9e9"/><rect x="810" y="10" width="380" height="340" rx="18" fill="#f1faf6"/><path d="M35 286H365M435 286H765M835 286H1165" stroke="#6b817a"/><path d="M75 48V285M145 48V285M52 55H168"/><text x="56" y="88" fill="#18372f" stroke="none" font-family="Arial" font-size="25" font-weight="700">START</text>
  <g transform="translate(180 170)"><circle cy="85" r="36"/><circle cx="105" cy="85" r="36"/><path d="M0 85l42-58 63 58H0l38-3 25-44M42 27h31M45 25l-10-34M35-9h25"/><circle cx="35" cy="-35" r="18" fill="#f4c95d"/><path d="M35-17l10 42M43 5l42 18"/></g><g transform="translate(470 178)"><circle cy="85" r="36"/><circle cx="105" cy="85" r="36"/><path d="M0 85l42-58 63 58H0l38-3 25-44M42 27h31M45 25l-10-34M35-9h25"/><circle cx="35" cy="-35" r="18" fill="#f4c95d"/><path d="M35-17l10 42M43 5l42 18"/></g><g transform="translate(625 130) scale(.9)"><circle cy="85" r="36"/><circle cx="105" cy="85" r="36"/><path d="M0 85l42-58 63 58H0l38-3 25-44M42 27h31M45 25l-10-34M35-9h25"/><circle cx="35" cy="-35" r="18" fill="#0f8b6d"/><path d="M35-17l10 42M43 5l42 18"/></g><path d="M1080 38v248M1140 38v248M1060 48h100"/><text x="1066" y="82" fill="#18372f" stroke="none" font-family="Arial" font-size="22" font-weight="700">FINISH</text><g transform="translate(910 170)"><circle cy="85" r="36"/><circle cx="105" cy="85" r="36"/><path d="M0 85l42-58 63 58H0l38-3 25-44M42 27h31M45 25l-10-34M35-9h25"/><circle cx="35" cy="-35" r="18" fill="#0f8b6d"/><path d="M35-17l10 42M43 5l42 18"/></g></g>
  <g font-family="Arial" font-size="18" font-weight="700" fill="#0f8b6d"><text x="28" y="334">1  The race begins</text><text x="428" y="334">2  One rider takes the lead</text><text x="828" y="334">3  He crosses the finish line</text></g>
